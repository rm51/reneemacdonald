<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renee MacDonald</title>
  <meta name="description" content="Renee MacDonald — find me on LinkedIn and GitHub.">
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --card: #ffffff;
      --border: #e2e2e0;
      --accent: #2f5bd3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --text: #f2f2f2;
        --muted: #a0a0a8;
        --card: #1e1e22;
        --border: #2e2e34;
        --accent: #8aa8ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 32px;
      color: var(--muted);
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: border-color 0.15s, transform 0.15s;
    }
    a:hover, a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Renee MacDonald</h1>
    <p>Find me online</p>
    <ul>
      <li><a href="https://www.linkedin.com/in/reneemacdonald" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://www.github.com/rm51" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </main>
</body>
</html>
